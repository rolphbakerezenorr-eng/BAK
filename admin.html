<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BakerPronos - Admin VIP</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background-color: #0b132b; color: #ffffff; padding: 15px; padding-bottom: 50px; }
    .panel { background: #1c2541; padding: 20px; border-radius: 12px; max-width: 500px; margin: auto; border: 1px solid #a855f7; margin-bottom: 20px; }
    h2, h3 { color: #c084fc; margin-bottom: 12px; font-size: 16px; }
    input, select { background: #0b132b; color: #fff; border: 1px solid #3a506b; padding: 9px; border-radius: 6px; font-size: 13px; width: 100%; margin-bottom: 10px; }
    button { background: #10b981; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; font-size: 13px; }
    .link-box { background: #0b132b; padding: 8px; border-radius: 6px; margin-top: 6px; font-size: 11px; word-break: break-all; border: 1px solid #5bc0be; color: #6fffe9; }
    .item { background: #0b132b; padding: 10px; border-radius: 6px; margin-top: 8px; border: 1px solid #3a506b; font-size: 12px; }
  </style>
</head>
<body>

  <!-- SEKSYON 1: Piblike Match VIP yo (Ak Drapo Peyi & Lig) -->
  <div class="panel">
    <h3>⚽ Piblike Match nan Kategori VIP</h3>
    
    <label style="font-size:12px; color:#cbd5e1;">Chwazi Lig la ak Drapo:</label>
    <select id="vipLeagueSelect" onchange="updateLeagueInput()">
      <option value="">-- Chwazi nan Lig Popilè yo --</option>
      <option value="🏴󠁧󠁢󠁥󠁮󠁧󠁿 Premier League (Angletè)">🏴󠁧󠁢󠁥󠁮󠁧󠁿 Premier League (Angletè)</option>
      <option value="🇪🇸 La Liga (Espay)">🇪🇸 La Liga (Espay)</option>
      <option value="🇮🇹 Serie A (Itali)">🇮🇹 Serie A (Itali)</option>
      <option value="🇩🇪 Bundesliga (Almay)">🇩🇪 Bundesliga (Almay)</option>
      <option value="🇫🇷 Ligue 1 (Frans)">🇫🇷 Ligue 1 (Frans)</option>
      <option value="🇪🇺 UEFA Champions League">🇪🇺 UEFA Champions League</option>
      <option value="🇪🇺 UEFA Europa League">🇪🇺 UEFA Europa League</option>
      <option value="🌍 Match Amikal / Lòt">🌍 Match Amikal / Lòt</option>
    </select>

    <input type="text" id="vipLeague" placeholder="Oubyen tape non lig la ak drapo a la...">
    <input type="text" id="vipHome" placeholder="Ekip Lakay (Home)">
    <input type="text" id="vipAway" placeholder="Ekip We Deh (Away)">
    <input type="text" id="vipProno" placeholder="Pwonostik (Egz: Home Win oswa BTTS)">
    <input type="text" id="vipOdds" placeholder="Cote a (Egz: 1.85)">
    <input type="date" id="vipDate">
    <input type="time" id="vipTime">
    <button onclick="publishVipMatch()">Piblike Match VIP a 🚀</button>
  </div>

  <!-- SEKSYON 2: Jenere Lyen pou Kliyan (ak Tan ki Ekspire) -->
  <div class="panel" style="border-color: #3b82f6;">
    <h3 style="color: #60a5fa;">🔗 Jenere Lyen VIP pou WhatsApp</h3>
    <input type="text" id="clientName" placeholder="Non Kliyan an (Egz: Jean)">
    
    <label style="font-size:12px; color:#cbd5e1;">Konbyen tan lyen an dwe dire:</label>
    <select id="durationHours">
      <option value="24">24 Èdtan (1 Jou)</option>
      <option value="48">48 Èdtan (2 Jou)</option>
      <option value="168">1 Semèn (7 Jou)</option>
      <option value="720">1 Mwa (30 Jou)</option>
    </select>

    <button onclick="generateVipLink()" style="background:#3b82f6;">Kreye Lyen WhatsApp 📲</button>

    <div style="margin-top: 15px;">
      <h4 style="color: #6fffe9; font-size: 13px; margin-bottom: 6px;">📋 Lyen ki aktif yo:</h4>
      <div id="linksList" style="max-height: 200px; overflow-y: auto;"></div>
    </div>
  </div>

  <script>
    document.getElementById("vipDate").valueAsDate = new Date();

    // Fonksyon pou otomatikman mete non lig la nan bwat la lè w chwazi nan lis la
    function updateLeagueInput() {
      let selectedVal = document.getElementById("vipLeagueSelect").value;
      if (selectedVal) {
        document.getElementById("vipLeague").value = selectedVal;
      }
    }

    // Fonksyon pou piblike match VIP
    function publishVipMatch() {
      let league = document.getElementById("vipLeague").value.trim() || "🏆 Match VIP";
      let home = document.getElementById("vipHome").value.trim();
      let away = document.getElementById("vipAway").value.trim();
      let prono = document.getElementById("vipProno").value.trim();
      let odds = document.getElementById("vipOdds").value.trim();
      let date = document.getElementById("vipDate").value;
      let time = document.getElementById("vipTime").value;

      if (!home || !away || !prono) {
        alert("Tanpri ranpli omwen ekip yo ak pwonostik la!");
        return;
      }

      let vipList = JSON.parse(localStorage.getItem("baker_vip_pronos")) || [];
      vipList.push({ league, home, away, prono, odds, date, time });
      localStorage.setItem("baker_vip_pronos", JSON.stringify(vipList));

      alert("✅ Match VIP a pibliye ak tout drapo lig la sou zòn VIP la!");
      document.getElementById("vipHome").value = "";
      document.getElementById("vipAway").value = "";
      document.getElementById("vipProno").value = "";
      document.getElementById("vipOdds").value = "";
    }

    // Fonksyon pou jenere lyen VIP ak tan
    function generateVipLink() {
      let name = document.getElementById("clientName").value.trim();
      let hours = parseInt(document.getElementById("durationHours").value);

      if (!name) {
        alert("Tanpri antre non kliyan an!");
        return;
      }

      let randomCode = "VIP-" + name.toUpperCase().replace(/\s+/g, '') + "-" + Math.floor(1000 + Math.random() * 9000);
      let expiryTime = new Date().getTime() + (hours * 60 * 60 * 1000);

      let linksDb = JSON.parse(localStorage.getItem("baker_vip_links")) || [];
      linksDb.push({
        clientName: name,
        code: randomCode,
        expiryTime: expiryTime,
        dateStr: new Date(expiryTime).toLocaleString()
      });
      localStorage.setItem("baker_vip_links", JSON.stringify(linksDb));

      alert("✅ Lyen an kreye avèk siksè!");
      document.getElementById("clientName").value = "";
      loadLinks();
    }

    function loadLinks() {
      let linksDb = JSON.parse(localStorage.getItem("baker_vip_links")) || [];
      let container = document.getElementById("linksList");

      if (linksDb.length === 0) {
        container.innerHTML = `<p style="color:#cbd5e1; font-size:11px; text-align:center;">Okenn lyen poko kreye.</p>`;
        return;
      }

      container.innerHTML = "";
      let baseUrl = window.location.href.split('?')[0].replace("admin_vip.html", "vip.html");

      linksDb.forEach((l, index) => {
        let fullLink = `${baseUrl}?code=${l.code}`;
        let isExpired = new Date().getTime() > l.expiryTime;

        container.innerHTML += `
          <div class="item">
            <div><b>Kliyan:</b> <span style="color:#6fffe9;">${l.clientName}</span></div>
            <div><b>Espirasyon:</b> <span style="color:${isExpired ? '#ef4444' : '#10b981'}">${l.dateStr}</span></div>
            <div class="link-box">${fullLink}</div>
            <button onclick="navigator.clipboard.writeText('${fullLink}'); alert('Lyen kopye!');" style="background:#2563eb; margin-top:5px; padding:6px; font-size:11px;">Kopye pou WhatsApp 📋</button>
            <button onclick="deleteLink(${index})" style="background:#ef4444; margin-top:4px; padding:4px; font-size:10px;">Efase</button>
          </div>
        `;
      });
    }

    function deleteLink(index) {
      let linksDb = JSON.parse(localStorage.getItem("baker_vip_links")) || [];
      linksDb.splice(index, 1);
      localStorage.setItem("baker_vip_links", JSON.stringify(linksDb));
      loadLinks();
    }

    window.onload = loadLinks;
  </script>
</body>
</html>
